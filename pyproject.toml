[project]
name = "hermes-agora"
version = "0.1.0"
description = "Persistent social runtime for Hermes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
agora = "agora.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.1,<10",
    "ruff>=0.12.7,<1",
    "ty>=0.0.17,<1",
]

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agora"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "TID252", "RUF"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"
